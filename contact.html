                <a class="navbar-brand" href="#">Blogspot</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"

                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link" aria-current="page" href="index.html">Home</a>
                        </li>
                        <li class="nav-item dropdown">
                            <a class="nav-link dropdown-toggle" href="#" id="navbarDropdown" role="button"
                                data-bs-toggle="dropdown" aria-expanded="false">
                                Blog
                            </a>
                            <ul class="dropdown-menu" aria-labelledby="navbarDropdown">
                                <li><a class="dropdown-item" href="#">Lifestyle</a></li>
                                <li><a class="dropdown-item" href="#">Travel</a></li>
                                <li>

                                </li>
                                <li><a class="dropdown-item" href="#">Food</a></li>

                        <li class="nav-item">

        <!-- Feedback Form -->
        <div class="container">
            <div class="row mt-4">
                <div class="col-6 mx-auto">
                    <div id="ui">
                        <h1 class="text-center display-4">Any Feedebacks?</h1>
                        <p class="text-center text-secondary">We'd like to hear your comments!</p>
                        <form class="form-group">
                            <div class="row">
                                <div class="col-lg-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" name="fname" class="form-control"
                                        placeholder="Enter Your First Name">
                                </div>

                                <div class="col-lg-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" name="lname" class="form-control"
                                        placeholder="Enter Your Last Name">
                                </div>
                            </div>
                            <br>
                            <label class="form-label">E-mail</label>
                            <input type="email" name="email" class="form-control" placeholder="Enter Your Email Here">
                            <br>
                            <label class="form-label">Comments</label>
                            <br>
                            <textarea name="comments" class="form-control" id="comments"
                                placeholder="Any thoughts about Blogspot?"></textarea>
                            <br>
                            <div class="d-grid gap-2">
                                <input type="submit" name="submit" value="Submit" class="btn btn-primary btn-lg">
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
